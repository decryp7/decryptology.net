    @media (max-width: 700px) {

        radial-gradient(ellipse at center, transparent 35%, rgba(4, 5, 10, 0.75) 100%); }

      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 18px rgba(226, 179, 92, 0.25)); }
    /* the 0 is the full moon */
    .moon { position: relative; width: 0.78em; height: 0.78em; border-radius: 50%; flex: none;
      background:
        radial-gradient(circle at 34% 30%, rgba(160, 130, 90, 0.18) 0 7%, transparent 8%),

    /* a little ladybug wandering along the moon's rim, like the one in Hannah's painting */
    .ladybug { position: absolute; width: 0.16em; height: 0.16em; top: -0.03em; right: 0.08em; transform: rotate(35deg);
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45)); }
    @media (prefers-reduced-motion: reduce) { .moon { animation: none; } }
    h1 { margin: 22px 0 6px; font: 500 clamp(22px, 5vw, 30px)/1.2 "Rubik", ui-sans-serif, system-ui, sans-serif; }
    p { margin: 0 0 26px; color: var(--muted); }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .home:hover, .home:focus-visible { background: #f0c778; }
    .mail { background: var(--panel); color: var(--ink); border: 1px solid #ffffff22; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .mail:hover, .mail:focus-visible { border-color: var(--gold); }
    #toast { position: fixed; left: 50%; top: 72px; transform: translate(-50%, -8px); z-index: 10; opacity: 0; pointer-events: none;

<body>

  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    // Mail links also copy the address, so it still works where no mail app is set up.
    document.querySelectorAll('a[href^="mailto:"]').forEach((a) => a.addEventListener('click', () => {
      const addr = a.href.replace(/^mailto:/, '');
      const t = document.getElementById('toast');
      navigator.clipboard?.writeText(addr).then(() => {
        t.textContent = addr + ' copied'; t.classList.add('show');
        clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
      }).catch(() => {});
    }));
  </script>

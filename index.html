  <style>
    :root {
      --bg: #07080d;
      --ink: #f3e7cf;
      --muted: #b9a988;
      --panel: rgba(12, 14, 22, 0.62);
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
      font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; position: relative; z-index: 1; }
    /* Still photo of the scene: shown while the 3D view loads, and kept if it can't run. */
    #still { position: fixed; inset: 0; z-index: 0; }
    #still img { width: 100%; height: 100%; object-fit: cover; display: block; }
    body.still canvas, body.still #views, body.still #hint { display: none; }
    #retry3d { display: none; }
    body.still #retry3d { display: inline-flex; margin-left: auto; pointer-events: auto; background: var(--panel);
      color: var(--muted); border: 1px solid #ffffff22; border-radius: 999px; padding: 6px 12px; font: inherit;
      font-size: 12px; cursor: pointer; backdrop-filter: blur(8px); }
    #loading { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
      background: rgba(7, 8, 13, 0.45); transition: opacity .6s ease; text-shadow: 0 1px 3px #000; }
    #loading.done { opacity: 0; pointer-events: none; }
    #bar { width: 220px; height: 2px; background: #222; margin-top: 12px; }
    #bar > i { display: block; height: 100%; width: 0; background: #e2b35c; transition: width .2s; }
    #hud, #nav { position: relative; z-index: 3; }
    #hud { position: fixed; left: 16px; bottom: 16px; right: 16px; display: flex; gap: 12px; align-items: center;
      pointer-events: none; }
    #views { pointer-events: auto; display: flex; gap: 2px; padding: 3px; background: var(--panel);
      border: 1px solid #ffffff22; border-radius: 999px; backdrop-filter: blur(8px); }
    #views button { display: inline-flex; align-items: center; gap: 6px; background: none; color: var(--muted);
      border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
    #views button:hover, #views button:focus-visible { color: var(--ink); background: #ffffff12; }
    #views button.active { color: #1a1206; background: #e2b35c; font-weight: 600; }
    #views svg { width: 15px; height: 15px; flex: none; }
    #hint { color: var(--muted); margin-left: auto; background: var(--panel); padding: 6px 12px; border-radius: 8px;
      font-size: 12px; transition: opacity .8s ease; }
    #hint.gone { opacity: 0; }
    #nav { pointer-events: none; }
    #nav a, #nav button { pointer-events: auto; }
    #links { position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
      max-width: calc(100% - 220px); }
    #links a { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none;
      background: var(--panel); border: 1px solid #ffffff22; border-radius: 999px; padding: 6px 12px; font-size: 13px;
      backdrop-filter: blur(8px); white-space: nowrap; }
    #links a:hover, #links a:focus-visible { border-color: #e2b35c; }
    #links a.cta { background: #e2b35c; color: #1a1206; border-color: #e2b35c; font-weight: 600; }
    #links a.cta:hover, #links a.cta:focus-visible { background: #f0c778; }
    #links svg { width: 14px; height: 14px; flex: none; }
    #links .ext { opacity: .55; font-size: 11px; margin-left: -2px; }
    #meta { position: fixed; top: 16px; left: 16px; display: flex; gap: 10px; font-size: 12px;
      background: var(--panel); padding: 6px 10px; border-radius: 8px; backdrop-filter: blur(8px); }
    #meta a { color: var(--muted); text-decoration: none; }
    #meta a:hover, #meta a:focus-visible { color: var(--ink); text-decoration: underline; }
    #menu-btn { display: none; }
    .touch { display: none; }
    @media (hover: none) and (pointer: coarse) { .mouse { display: none; } .touch { display: inline; } }
    @media (max-width: 600px) {
      #hud { left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); flex-direction: column-reverse; gap: 8px; }
      #views { width: 100%; box-sizing: border-box; }
      #views button { flex: 1; flex-direction: column; gap: 3px; padding: 7px 4px; font-size: 11px; border-radius: 16px; }
      #views svg { width: 18px; height: 18px; }
      #menu-btn { display: inline-flex; align-items: center; gap: 6px; position: fixed; right: 12px;
        top: max(12px, env(safe-area-inset-top)); background: var(--panel); color: var(--ink); border: 1px solid #ffffff22;
        border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); }
      #nav.open #menu-btn { border-color: #e2b35c; }
      #panel { display: none; position: fixed; right: 12px; top: calc(max(12px, env(safe-area-inset-top)) + 44px);
        width: min(260px, calc(100% - 24px)); box-sizing: border-box; padding: 8px; border-radius: 14px;
        background: rgba(12, 14, 22, 0.9); border: 1px solid #ffffff22; backdrop-filter: blur(12px); }
      #nav.open #panel { display: block; }
      #links, #meta { position: static; max-width: none; background: none; backdrop-filter: none; padding: 0; }
      #links { flex-direction: column; gap: 2px; }
      #links a { border: 0; background: none; border-radius: 8px; padding: 10px 10px; font-size: 15px; gap: 10px; }
      #links a:hover, #links a:focus-visible { background: #ffffff12; }
      #links svg { width: 17px; height: 17px; }
      #links .ext { margin-left: auto; }
      #links a.cta { margin-top: 4px; justify-content: center; }
      #meta { margin-top: 8px; padding: 8px 10px 4px; border-top: 1px solid #ffffff1a; border-radius: 0; font-size: 13px; gap: 16px; }
      #hint { margin: 0; padding: 5px 10px; text-align: center; }
    }

  <script>
    (() => {
      const nav = document.getElementById('nav'), btn = document.getElementById('menu-btn');
      const set = (open) => { nav.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); };
      btn.addEventListener('click', (e) => { e.stopPropagation(); set(!nav.classList.contains('open')); });
      document.addEventListener('pointerdown', (e) => { if (!nav.contains(e.target)) set(false); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
    })();
  </script>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

  <script type="module">
    // Start the 3D scene only once the page (still photo, links) has painted and finished loading, so the
    // page itself is fast; the scene fades in over the photo a moment later.
    const start = () => import('./main.js?v=202609290658').catch((e) => console.warn(e));
    const whenIdle = () => ('requestIdleCallback' in window ? requestIdleCallback(start, { timeout: 1500 }) : setTimeout(start, 200));
    if (document.readyState === 'complete') whenIdle(); else addEventListener('load', whenIdle, { once: true });
  </script>
